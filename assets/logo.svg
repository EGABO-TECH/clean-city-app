<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e6b3b"/>
      <stop offset="100%" stop-color="#0f381f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="256" fill="url(#shine)"/>
  
  <!-- Subtle ring accent -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Recycling Symbol - Three chasing arrows -->
  <g transform="translate(256,256)" filter="url(#shadow)">
    <!-- Arrow 1 - Top -->
    <g fill="#ffffff">
      <path d="M-12,-60 L-55,-135 C-60,-143 -55,-153 -45,-153 L45,-153 C55,-153 60,-143 55,-135 L12,-60 L32,-60 L0,-5 L-32,-60 Z" opacity="0.95"/>
    </g>
    
    <!-- Arrow 2 - Bottom Right -->
    <g fill="#ffffff" transform="rotate(120)">
      <path d="M-12,-60 L-55,-135 C-60,-143 -55,-153 -45,-153 L45,-153 C55,-153 60,-143 55,-135 L12,-60 L32,-60 L0,-5 L-32,-60 Z" opacity="0.95"/>
    </g>
    
    <!-- Arrow 3 - Bottom Left -->
    <g fill="#ffffff" transform="rotate(240)">
      <path d="M-12,-60 L-55,-135 C-60,-143 -55,-153 -45,-153 L45,-153 C55,-153 60,-143 55,-135 L12,-60 L32,-60 L0,-5 L-32,-60 Z" opacity="0.95"/>
    </g>
  </g>
  
  <!-- Leaf Accent - Top Right -->
  <g transform="translate(256,256)">
    <path d="M45,-85 Q90,-135 60,-180 Q20,-145 45,-85 Z" fill="rgba(255,255,255,0.9)"/>
    <path d="M48,-92 Q68,-130 58,-170" fill="none" stroke="rgba(30,107,59,0.5)" stroke-width="2" stroke-linecap="round"/>
    <!-- Small leaf veins -->
    <path d="M52,-105 Q60,-115 55,-125" fill="none" stroke="rgba(30,107,59,0.3)" stroke-width="1" stroke-linecap="round"/>
    <path d="M50,-115 Q58,-125 55,-140" fill="none" stroke="rgba(30,107,59,0.3)" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
